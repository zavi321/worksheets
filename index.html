<script>
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var CURRENT_PROFILE = { school_name: '' };
// ---------- A–Z English worksheet (Question Papers → 🔤 A–Z Worksheet) ----------
let azMode = false, azLetter = 'A';
const AZ_AL = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const AZ_RAW = {A:"🍎 apple,🐜 ant,🪓 axe,✈️ airplane",B:"🏀 ball,🐻 bear,🍌 banana,🦋 butterfly",C:"🐱 cat,🚗 car,🎂 cake,🐄 cow",D:"🐶 dog,🦆 duck,🥁 drum,🐬 dolphin",E:"🐘 elephant,🥚 egg,👁️ eye,🦅 eagle",F:"🐟 fish,🌸 flower,🐸 frog,🔥 fire",G:"🍇 grapes,🐐 goat,🎁 gift,🎸 guitar",H:"🏠 house,🐴 horse,🎩 hat,❤️ heart",I:"🧊 ice,🏝️ island,🦎 iguana,🐛 insect",J:"🫙 jar,🪼 jellyfish,🧃 juice,🚙 jeep",K:"🪁 kite,🔑 key,🦘 kangaroo,🤴 king",L:"🦁 lion,🍋 lemon,🍃 leaf,🪜 ladder",M:"🐒 monkey,🌙 moon,🥭 mango,🐭 mouse",N:"👃 nose,🪺 nest,📓 notebook,🥜 nut",O:"🍊 orange,🦉 owl,🐙 octopus,🐂 ox",P:"🦜 parrot,🍍 pineapple,🐧 penguin,🍕 pizza",Q:"👸 queen,🪶 quill,🐦 quail,❓ question",R:"🌈 rainbow,🐰 rabbit,🚀 rocket,🌹 rose",S:"☀️ sun,⭐ star,🐍 snake,🧦 sock",T:"🌳 tree,🐯 tiger,🐢 turtle,🍅 tomato",U:"☂️ umbrella,🦄 unicorn,⬆️ up,⚱️ urn",V:"🎻 violin,🚐 van,🌋 volcano,🏺 vase",W:"🍉 watermelon,🐋 whale,⌚ watch,🐺 wolf",X:"🎹 xylophone,🦊 fox,📦 box,🩻 xray",Y:"🪀 yoyo,🧶 yarn,🟡 yellow,🛥️ yacht",Z:"🦓 zebra,🤐 zip,0️⃣ zero,〰️ zigzag"};
const AZ_D = {}; AZ_AL.forEach(k => { AZ_D[k] = AZ_RAW[k].split(',').map(s => s.split(' ')); });
function azRng(s) { return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function azShuf(a, r) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function azCell(tx, low) {
  return '<div><svg viewBox="0 0 100 80"><line x1="0" x2="100" y1="' + (low ? 46 : 48) + '" y2="' + (low ? 46 : 48) + '" stroke="#1a2a9c" stroke-dasharray="3 3" stroke-width=".8"/>' +
    '<text x="50" y="' + (low ? 68 : 76) + '" text-anchor="middle" font-size="' + (low ? 84 : 80) + '" fill="none" stroke="#1a2a9c" stroke-width="1.6" stroke-dasharray="4 4" font-family="Arial,sans-serif">' + tx + '</text></svg></div>';
}
function azSheetHtml(L, cls) {
  const r = azRng(L.charCodeAt(0) * 977 + 7), low = L.toLowerCase(), it = AZ_D[L];
  const oth = azShuf(AZ_AL.filter(x => x !== L).flatMap(x => AZ_D[x]), r);
  const lets = AZ_AL.filter(x => x !== L).map(x => x.toLowerCase());
  const verb = L === 'X' ? 'that have' : 'that start with';
  const sch = (typeof CURRENT_PROFILE !== 'undefined' && CURRENT_PROFILE && CURRENT_PROFILE.school_name) ? CURRENT_PROFILE.school_name : '';
  let h = '<div class="azws ' + cls + '">' + azHdr();
  h += '<div class="az-nm"><span>Name: ______________</span><span>Date: __________</span></div>';
  h += '<div class="az-t">1. Trace the letter ' + L + '.</div><div class="az-row">' + azCell(L).repeat(5) + '</div>';
  h += '<div class="az-t">2. Trace the letter ' + low + '.</div><div class="az-row">' + azCell(low, 1).repeat(5) + '</div>';
  h += '<div class="az-two"><div><div class="az-t">3. Circle the correct letter.</div>';
  it.forEach(p => { const o = azShuf([low, ...azShuf(lets, r).slice(0, 2)], r); h += '<div class="az-r"><div class="az-e">' + p[0] + '</div><div class="az-o">' + o.map(x => '<span>' + x + '</span>').join('') + '</div></div>'; });
  h += '</div><div><div class="az-t">4. Match the letter ' + L + ' with the pictures.</div><div class="az-m"><div class="az-big">' + L + '</div><div class="az-pics">';
  azShuf([it[0], it[1], oth[0], oth[1]], r).forEach(p => { h += '<div>' + p[0] + '</div>'; });
  h += '</div></div></div></div><div class="az-t">5. Write the missing letter.</div><div class="az-five">';
  it.forEach(p => { const w = p[1], i = w.indexOf(low); h += '<div><div class="az-e5">' + p[0] + '</div><div class="az-w">' + w.slice(0, i) + '<span class="az-bl"></span>' + w.slice(i + 1) + '</div></div>'; });
  h += '</div><div class="az-t">6. Colour the pictures ' + verb + ' letter ' + L + '.</div><div class="az-six">';
  azShuf([...it, oth[2], oth[3]], r).forEach(p => { h += '<div><span class="az-g">' + p[0] + '</span></div>'; });
  return h + '</div></div>';
}
// ---------- Urdu alphabet worksheet (ا سے ے) ----------
let azLang = 'en', urLetter = 'ا';
const UR_AL = 'ا ب پ ت ٹ ث ج چ ح خ د ڈ ذ ر ڑ ز ژ س ش ص ض ط ظ ع غ ف ق ک گ ل م ن و ہ ھ ی ے'.split(' ');
const UR_RAW = {
'ا':'🦉:اُلو,🍇:انگور,🐫:اونٹ,🥚:انڈا','ب':'🐐:بکری,🦆:بطخ,🐱:بلی,🐒:بندر','پ':'🪁:پتنگ,🌸:پھول,✏️:پنسل,🐦:پرندہ','ت':'🦋:تتلی,🍉:تربوز,👑:تاج,🔒:تالا',
'ٹ':'🎩:ٹوپی,🍅:ٹماٹر,🚆:ٹرین,🚚:ٹرک','ث':'🍑:ثمر,💰:ثروت,🤲:ثواب,💡:ثریا','ج':'✈️:جہاز,👟:جوتا,🚙:جیپ,🌲:جنگل','چ':'🐤:چڑیا,🌙:چاند,🥄:چمچ,🔑:چابی',
'ح':'🍮:حلوہ,🧮:حساب,🌿:حنا,🔤:حرف','خ':'🐰:خرگوش,⛺:خیمہ,✉️:خط,🍈:خربوزہ','د':'🌳:درخت,🚪:دروازہ,❤️:دل,🥛:دودھ','ڈ':'📦:ڈبہ,📮:ڈاکیا,🥁:ڈھول,👨‍⚕️:ڈاکٹر',
'ذ':'👅:ذائقہ,📿:ذکر,🔬:ذرہ,🧠:ذہن','ر':'🫓:روٹی,🪢:رسی,🚂:ریل,🎨:رنگ','ڑ':'⛰️:پہاڑ,🪆:گڑیا,🐛:کیڑا,🐑:بھیڑ','ز':'🦓:زیبرا,🌍:زمین,🪜:زینہ,🦒:زرافہ',
'ژ':'🌨️:ژالہ,📺:ٹیلیویژن,👁️:مژگاں,🏰:دژ','س':'🍎:سیب,☀️:سورج,🐍:سانپ,⭐:ستارہ','ش':'🦁:شیر,🍯:شہد,♟️:شطرنج,🕯️:شمع','ص':'🧼:صابن,🛋️:صوفہ,🧰:صندوق,🌅:صبح',
'ض':'✖️:ضرب,🍽️:ضیافت,😠:ضدی,🗺️:ضلع','ط':'🦜:طوطا,🪘:طبلہ,🛩️:طیارہ,💪:طاقت','ظ':'🍲:ظرف,🕌:ظہر,😡:ظالم,🏆:ظفر','ع':'👓:عینک,🦅:عقاب,🚩:علم,🎉:عید',
'غ':'🎈:غبارہ,🕳️:غار,🤿:غوطہ,🚿:غسل','ف':'🐘:فیل,⛲:فوارہ,⚽:فٹبال,📱:فون','ق':'🖊️:قلم,✂️:قینچی,🏰:قلعہ,👕:قمیص','ک':'🐶:کتا,📖:کتاب,🕊️:کبوتر,🍌:کیلا',
'گ':'🐄:گائے,🐴:گھوڑا,⌚:گھڑی,🌹:گلاب','ل':'🎲:لڈو,🍋:لیمو,🪵:لکڑی,🏮:لالٹین','م':'🐟:مچھلی,🐔:مرغی,🦚:مور,🪰:مکھی','ن':'🍐:ناشپاتی,🚰:نل,🧂:نمک,👃:ناک',
'و':'⚖️:وزن,📄:ورق,🚐:وین,🐋:وہیل','ہ':'✋:ہاتھ,🦌:ہرن,🔨:ہتھوڑا,🚜:ہل','ھ':'🐘:ہاتھی,🌴:کھجور,🐻:بھالو,🌸:پھول','ی':'🧊:یخ,💎:یاقوت,🧘:یوگا,🐃:یاک','ے':'🧸:کھلونے,🎈:غبارے,🍃:پتے,⭐:ستارے'
};
const UR_D = {}; UR_AL.forEach(k => { UR_D[k] = UR_RAW[k].split(',').map(s => s.split(':')); });
const UR_FONT = "'Noto Sans Urdu','Noto Naskh Arabic','Noto Sans Arabic',Tahoma,sans-serif";
function urCell(tx, big) {
  const fs = big ? 66 : Math.max(16, Math.min(40, Math.floor(165 / tx.length)));

}
function urSheetHtml(L, cls) {
  const r = azRng(L.codePointAt(0) * 31 + 5), it = UR_D[L];
  const oth = azShuf(UR_AL.filter(x => x !== L).flatMap(x => UR_D[x]), r).filter(p => !it.some(q => q[0] === p[0]));

  let h = '<div class="azws az-rtl ' + cls + '" dir="rtl">' + azHdr();
  h += '<div class="az-nm"><span>نام: ______________</span><span>تاریخ: __________</span></div>';
  h += '<div class="az-t">1۔ ہلکے رنگ پر پھیر کر حرف «' + L + '» لکھیں۔</div><div class="az-row">' + urCell(L, 1).repeat(5) + '</div>';
  h += '<div class="az-t">2۔ ہلکے رنگ پر پھیر کر الفاظ لکھیں۔</div><div class="az-row">' + it.map(p => urCell(p[1])).join('') + '</div>';
  h += '<div class="az-two"><div><div class="az-t">3۔ صحیح حرف پر دائرہ لگائیں۔</div>';
  it.forEach(p => { const o = azShuf([L, ...azShuf(lets, r).slice(0, 2)], r); h += '<div class="az-r"><div class="az-e">' + p[0] + '</div><div class="az-o">' + o.map(x => '<span>' + x + '</span>').join('') + '</div></div>'; });
  h += '</div><div><div class="az-t">4۔ حرف «' + L + '» کو تصویروں سے ملائیں۔</div><div class="az-m"><div class="az-big">' + L + '</div><div class="az-pics">';
  azShuf([it[0], it[1], oth[0], oth[1]], r).forEach(p => { h += '<div>' + p[0] + '</div>'; });
  h += '</div></div></div></div><div class="az-t">5۔ خالی جگہ میں گم شدہ حرف لکھیں۔</div><div class="az-five">';
  it.forEach(p => { const w = p[1], i = w.indexOf(L); h += '<div><div class="az-e5">' + p[0] + '</div><div class="az-w">' + w.slice(0, i) + '<span class="az-bl"></span>' + w.slice(i + 1) + '</div></div>'; });
  h += '</div><div class="az-t">6۔ ان تصویروں کو رنگ کریں جن کے نام ' + (mid ? 'میں «' + L + '» آتا ہے۔' : '«' + L + '» سے شروع ہوتے ہیں۔') + '</div><div class="az-six">';
  azShuf([...it, oth[2], oth[3]], r).forEach(p => { h += '<div><span class="az-g">' + p[0] + '</span></div>'; });
  return h + '</div></div>';
}
// ---------- Urdu page 2: letter forms + joining / breaking words ----------
function ur2Cell(tx, lab, blank) {
  return '<div><svg viewBox="0 0 100 70"><line x1="0" x2="100" y1="46" y2="46" stroke="#1a2a9c" stroke-dasharray="3 3" stroke-width=".8"/>' +
    (blank ? '' : '<text x="50" y="34" dominant-baseline="central" text-anchor="middle" font-size="58" fill="#c9ceef" stroke="none" font-family="' + UR_FONT + '">' + tx + '</text>') +
    '</svg><div class="az2-lb">' + lab + '</div></div>';
}
function urSheet2Html(L, cls) {
  const it = UR_D[L], J = '\u200D', nj = 'ادڈذرڑزژوے'.includes(L);
  const forms = nj ? [[L, 'الگ شکل'], [J + L, 'آخر میں']] : [[L, 'الگ شکل'], [L + J, 'شروع میں'], [J + L + J, 'درمیان میں'], [J + L, 'آخر میں']];
  const parts = w => [...w.replace(/[\u064B-\u065F\u0670\u06EA-\u06ED]/g, '')];
  const sch = (typeof CURRENT_PROFILE !== 'undefined' && CURRENT_PROFILE && CURRENT_PROFILE.school_name) ? CURRENT_PROFILE.school_name : '';
  let h = '<div class="azws az-rtl az-p2 ' + cls + '" dir="rtl">' + azHdr();
  h += '<div class="az-nm"><span>نام: ______________</span><span>تاریخ: __________</span></div>';
  h += '<div class="az-t">1۔ حرف «' + L + '» کی مختلف شکلیں ہلکے رنگ پر پھیر کر لکھیں۔</div><div class="az2-forms">' + forms.map(f => ur2Cell(f[0], f[1])).join('') + '</div>';
  h += '<div class="az-t">2۔ حرف «' + L + '» کی شکلیں خود لکھیں۔</div><div class="az2-forms">' + forms.map(f => ur2Cell('', f[1], 1)).join('') + '</div>';
  h += '<div class="az-t">3۔ جوڑ سے توڑ: لفظ کو توڑ کر حروف الگ الگ لکھیں۔</div><div class="az2-list">';
  it.forEach(p => { h += '<div class="az2-ln"><div class="az2-src"><span class="az2-em">' + p[0] + '</span><span>' + p[1] + '</span></div><div class="az2-bx">' + parts(p[1]).map(() => '<div></div>').join('') + '</div></div>'; });
  h += '</div><div class="az-t">4۔ توڑ سے جوڑ: الگ حروف کو جوڑ کر لفظ لکھیں۔</div><div class="az2-list">';
  it.forEach(p => { const ps = parts(p[1]), fs = ps.length > 6 ? 20 : ps.length > 4 ? 26 : 32; h += '<div class="az2-ln"><div class="az2-src az2-brk" style="font-size:' + fs + 'px;">' + ps.map(c => '<span>' + c + '</span>').join('') + '</div><div class="az2-bx"><div></div></div></div>'; });
  return h + '</div></div>';
}


function azHdr() {
  var sc = CURRENT_PROFILE.school_name || '', c = CURRENT_PROFILE.cls || '', h = '';
  if (sc) h += '<div class="az-hd" dir="auto">' + esc(sc) + '</div>';
  if (c) h += '<div class="az-cl" dir="auto">' + esc(c) + '</div>';
  return h;
}
// ---------- Urdu NURSERY: one easy page per letter ----------
function urNurseryHtml(L, cls) {
  var r = azRng(L.codePointAt(0) * 53 + 11), it = UR_D[L];
  var oth = azShuf(UR_AL.filter(function(x){ return x !== L; }).flatMap(function(x){ return UR_D[x]; }), r).filter(function(p){ return !it.some(function(q){ return q[0] === p[0]; }); });
  var mid = 'ڑژھے'.indexOf(L) >= 0;
  var h = '<div class="azws az-rtl az-nur ' + cls + '" dir="rtl">' + azHdr();
  h += '<div class="az-nm"><span>نام: ______________</span><span>تاریخ: __________</span></div>';
  h += '<div class="nu-ban"><span class="b">' + L + '</span><span class="s">' + (mid ? 'والا لفظ' : 'سے') + '</span><span class="e">' + it[0][0] + '</span><span class="w">' + it[0][1] + '</span></div>';
  h += '<div class="az-t">1۔ ہلکے رنگ پر پھیر کر حرف «' + L + '» لکھیں۔</div><div class="az-row">' + urCell(L, 1).repeat(4) + '</div>';
  h += '<div class="az-t">2۔ حرف «' + L + '» خود لکھیں۔</div><div class="az-row">' + urCell('', 1).repeat(4) + '</div>';
  h += '<div class="az-t">3۔ حرف «' + L + '» کو صحیح تصویروں سے ملائیں۔</div><div class="nu-m"><div class="az-big">' + L + '</div><div class="nu-pics">';
  azShuf([it[0], it[1], oth[0], oth[1]], r).forEach(function(p){ h += '<div>' + p[0] + '</div>'; });
  h += '</div></div><div class="az-t">4۔ ان تصویروں کو رنگ کریں جن کے نام ' + (mid ? 'میں «' + L + '» آتا ہے۔' : '«' + L + '» سے شروع ہوتے ہیں۔') + '</div><div class="az-six">';
  azShuf([it[0], it[1], it[2], oth[2], oth[3], oth[4]], r).forEach(function(p){ h += '<div><span class="az-g">' + p[0] + '</span></div>'; });
  return h + '</div></div>';
}

var cur = { en: 'A', ur: 'ا', nur: 'ا' }, lastW = 0, lastPrint = 0;
function $(id){ return document.getElementById(id); }
function letters(){ return azLang === 'en' ? AZ_AL : UR_AL; }
function pages(L, cls){ return azLang === 'nur' ? urNurseryHtml(L, cls) : azLang === 'ur' ? urSheetHtml(L, cls) + urSheet2Html(L, cls) : azSheetHtml(L, cls); }
function school(){
  CURRENT_PROFILE.school_name = $('sch').value.trim();
  CURRENT_PROFILE.cls = $('cls').value.trim();
  try { localStorage.setItem('ws_school', CURRENT_PROFILE.school_name); localStorage.setItem('ws_cls', CURRENT_PROFILE.cls); } catch (e) {}
}
function setLang(l){ azLang = l; if (l === 'nur' && !$('cls').value.trim()) $('cls').value = 'نرسری'; render(); }
function pick(L){ cur[azLang] = L; render(); }
function fit(force){
  var w = $('prevwrap'), p = $('pv'); if (!w || !p) return;
  var cw = Math.round(w.clientWidth);
  if (!cw || (!force && Math.abs(cw - lastW) < 8)) return;
  lastW = cw;
  var k = Math.min(1, cw / 733);
  if (window.CSS && CSS.supports && CSS.supports('zoom', '1')) { p.style.zoom = String(k); }
  else { p.style.transformOrigin = 'top left'; p.style.transform = 'scale(' + k + ')'; w.style.height = Math.ceil(p.offsetHeight * k) + 'px'; }
}
function render(){
  school();
  var ur = azLang !== 'en', list = letters(), c = cur[azLang];
  $('bEn').className = azLang === 'en' ? 'main' : 'ghost'; $('bUr').className = azLang === 'ur' ? 'main' : 'ghost'; $('bNu').className = azLang === 'nur' ? 'main' : 'ghost';
  var g = $('grid'); g.style.gridTemplateColumns = 'repeat(' + (ur ? 8 : 7) + ',1fr)'; g.style.direction = ur ? 'rtl' : 'ltr';
  g.innerHTML = list.map(function(L){ return '<button class="' + (L === c ? 'main' : 'ghost') + ' lt" onclick="pick(\'' + L + '\')">' + L + '</button>'; }).join('');
  $('pr1').textContent = '🖨️ ' + (ur ? 'پرنٹ: ' : 'Print: ') + c + (azLang === 'ur' ? ' (2 صفحے)' : azLang === 'nur' ? ' (1 صفحہ)' : ' (1 page)');

  }

}
function say(t){ $('st').textContent = t; }
window.onerror = function(m, u, l){ say('خرابی: ' + m + ' (line ' + l + ')'); };
function doPrint(ls){
  say('بٹن دب گیا… صفحات بن رہے ہیں');
  try {
    school();
    $('sheets').innerHTML = ls.map(function(L){ return pages(L, 'azpage'); }).join('');
    say('صفحات تیار (' + ls.length + ' حرف)۔ پرنٹ ڈائیلاگ کھل رہا ہے…');

    say('پرنٹ کی کال ہو گئی۔ ڈائیلاگ نظر نہ آئے تو Chrome ⋮ → Share → Print آزمائیں۔');

}

function printAll(){ doPrint(letters().slice()); }

window.addEventListener('resize', function(){ fit(false); });
