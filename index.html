<div class="ui">

<div class="row" style="flex-wrap:wrap"><button id="bEnN" style="flex:1 1 45%" onclick="setLang('enn')">English Nursery</button><button id="bNu" style="flex:1 1 45%" onclick="setLang('nur')">اردو نرسری</button><button id="bEn" style="flex:1 1 45%" onclick="setLang('en')">English (KG)</button><button id="bUr" style="flex:1 1 45%" onclick="setLang('ur')">اردو (کے جی)</button><button id="bMt" style="flex:1 1 45%" onclick="setLang('mth')">🔢 Maths Nursery (1–20)</button><button id="bMk" style="flex:1 1 45%" onclick="setLang('mtk')">🔢 Maths KG (1–50)</button></div>

<script>
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var CURRENT_PROFILE = { school_name: '' };

// ===== Maths KG: counting 1-50, before/after/between, add, take away, number names =====
var KGM = ['1–10','11–20','21–30','31–40','41–50','Before After','Between','Add 1–5','Add 6–10','Take away 1–5','Take away 6–10','Names 1–10','Names 11–20','Names 21–30','Names 31–40','Names 41–50'];
var KGB = ['1–10','11–20','21–30','31–40','41–50','◀ ▶','◀ ? ▶','+','+','−','−','Abc','Abc','Abc','Abc','Abc'];

      } else if (d === 2) {
